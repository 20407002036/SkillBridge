<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillBridge - Generating Roadmap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .spinner {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            border: 3px solid;
            border-color: #137fec #137fec transparent transparent;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        .spinner::after,
        .spinner::before {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
            border: 3px solid;
            border-color: transparent transparent #137fec20 #137fec20;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            animation: rotationBack 0.5s linear infinite;
            transform-origin: center center;
        }
        .spinner::before {
            width: 56px;
            height: 56px;
            border-color: #137fec #137fec transparent transparent;
            animation: rotation 1.5s linear infinite;
        }
        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes rotationBack {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(-360deg);
            }
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="flex flex-col items-center justify-center min-h-screen p-4">
<div class="w-full max-w-lg text-center">
<div class="mb-12">
<span class="spinner"></span>
</div>
<h1 class="text-2xl md:text-3xl font-bold text-background-dark dark:text-background-light">
                Analyzing your resume and generating your personalized roadmap…
            </h1>
<p class="mt-4 text-base text-background-dark/70 dark:text-background-light/70">
                This may take a few moments. Please don't close this page.
            </p>
</div>
</div>

</body></html>
