<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<title>SkillBridge - Authentication</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#137fec",
            "background-light": "#f6f7f8",
            "background-dark": "#101922",
            "foreground-light": "#111418",
            "foreground-dark": "#f0f2f4",
            "input-light": "#ffffff",
            "input-dark": "#1a2734",
            "border-light": "#dbe0e6",
            "border-dark": "#324355",
            "muted-light": "#617589",
            "muted-dark": "#a0b1c2"
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .tab-active {
      --tw-bg-opacity: 1;
      background-color: rgb(19 127 236 / var(--tw-bg-opacity));
      color: white;
    }
    .tab-inactive {
      background-color: transparent;
      color: #617589;
    }
    .dark .tab-inactive {
        color: #a0b1c2;
    }
    .dark .tab-inactive:hover {
        background-color: rgb(19 127 236 / 0.1);
    }
    .tab-inactive:hover {
        background-color: rgb(19 127 236 / 0.1);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-foreground-light dark:text-foreground-dark">
<div class="flex flex-col min-h-screen">
<header class="w-full">
<div class="container mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between py-5 border-b border-border-light dark:border-border-dark">
<div class="flex items-center gap-3">
<svg class="text-primary size-7" fill="currentColor" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z"></path>
</svg>
<h1 class="text-xl font-bold">SkillBridge</h1>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Home</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Roadmaps</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Courses</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Community</a>
</nav>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8">
<div class="bg-input-light dark:bg-input-dark p-8 rounded-xl border border-border-light dark:border-border-dark shadow-sm">
<div class="mb-8">
<div class="flex items-center justify-center p-1 bg-background-light dark:bg-background-dark rounded-lg">
<button class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-300 tab-active" id="signup-tab" onclick="showForm('signup')">Sign Up</button>
<button class="flex-1 py-2.5 text-sm font-semibold rounded-md transition-all duration-300 tab-inactive" id="login-tab" onclick="showForm('login')">Log In</button>
</div>
</div>
<div id="signup-form">
<h2 class="text-center text-2xl font-bold mb-1">Create an Account</h2>
<p class="text-center text-muted-light dark:text-muted-dark text-sm mb-6">Start your learning journey today.</p>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-foreground-light dark:text-foreground-dark" for="signup-email">Email address</label>
<div class="mt-2">
<input autocomplete="email" class="block w-full rounded-lg border-0 py-3 px-4 bg-background-light dark:bg-background-dark placeholder:text-muted-light dark:placeholder:text-muted-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="signup-email" name="email" required="" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-foreground-light dark:text-foreground-dark" for="signup-password">Password</label>
<div class="mt-2">
<input autocomplete="new-password" class="block w-full rounded-lg border-0 py-3 px-4 bg-background-light dark:bg-background-dark placeholder:text-muted-light dark:placeholder:text-muted-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="signup-password" name="password" required="" type="password"/>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" type="submit">Sign Up</button>
</div>
</form>
</div>
<div class="hidden" id="login-form">
<h2 class="text-center text-2xl font-bold mb-1">Welcome Back</h2>
<p class="text-center text-muted-light dark:text-muted-dark text-sm mb-6">Log in to continue your progress.</p>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-medium text-foreground-light dark:text-foreground-dark" for="login-email">Email address</label>
<div class="mt-2">
<input autocomplete="email" class="block w-full rounded-lg border-0 py-3 px-4 bg-background-light dark:bg-background-dark placeholder:text-muted-light dark:placeholder:text-muted-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="login-email" name="email" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between">
<label class="block text-sm font-medium text-foreground-light dark:text-foreground-dark" for="login-password">Password</label>
<div class="text-sm">
<a class="font-semibold text-primary hover:text-primary/90" href="#">Forgot password?</a>
</div>
</div>
<div class="mt-2">
<input autocomplete="current-password" class="block w-full rounded-lg border-0 py-3 px-4 bg-background-light dark:bg-background-dark placeholder:text-muted-light dark:placeholder:text-muted-dark focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6" id="login-password" name="password" required="" type="password"/>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-lg bg-primary px-3 py-3 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary" type="submit">Log In</button>
</div>
</form>
</div>
</div>
</div>
</main>
</div>
<script>
    function showForm(form) {
      const signupForm = document.getElementById('signup-form');
      const loginForm = document.getElementById('login-form');
      const signupTab = document.getElementById('signup-tab');
      const loginTab = document.getElementById('login-tab');
      if (form === 'signup') {
        signupForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        signupTab.classList.remove('tab-inactive');
        signupTab.classList.add('tab-active');
        loginTab.classList.remove('tab-active');
        loginTab.classList.add('tab-inactive');
      } else {
        signupForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        signupTab.classList.remove('tab-active');
        signupTab.classList.add('tab-inactive');
        loginTab.classList.remove('tab-inactive');
        loginTab.classList.add('tab-active');
      }
    }
  </script>

</body></html>
