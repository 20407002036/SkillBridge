<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope:wght@400;500;700;800" onload="this.rel='stylesheet'" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
            },
            fontFamily: {
              display: ["Manrope"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px"
            },
          },
        },
      };
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>SkillBridge - Start Your Journey</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-slate-200/80 dark:border-slate-800/80 px-10 py-4">
<div class="flex items-center gap-3 text-slate-900 dark:text-white">
<svg class="h-6 w-6 text-primary" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z"></path>
<path d="M12 12L4 12L12 20V12Z"></path>
</svg>
<h1 class="text-xl font-bold">SkillBridge</h1>
</div>
<nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-700 dark:text-slate-300">
<a class="hover:text-primary transition-colors" href="#">Home</a>
<a class="hover:text-primary transition-colors" href="#">Roadmaps</a>
<a class="hover:text-primary transition-colors" href="#">Courses</a>
<a class="hover:text-primary transition-colors" href="#">Community</a>
<a class="hover:text-primary transition-colors" href="#">Resources</a>
</nav>
<button class="flex min-w-[100px] items-center justify-center rounded-lg h-10 px-5 bg-primary text-white text-sm font-bold shadow-sm hover:bg-primary/90 transition-colors">
<span>Get Started</span>
</button>
</header>
<main class="flex flex-1 justify-center py-12 px-4 sm:px-6 lg:px-8">
<div class="w-full max-w-2xl space-y-8">
<div class="text-center">
<p class="text-sm font-semibold text-primary uppercase tracking-wider">Step 1 of 3</p>
<div class="mt-2 h-1.5 w-full rounded-full bg-slate-200 dark:bg-slate-700">
<div class="h-1.5 rounded-full bg-primary" style="width: 33%;"></div>
</div>
</div>
<div class="bg-white dark:bg-slate-900/50 p-8 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800">
<div class="text-center mb-8">
<h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">Create Your Learning Roadmap</h2>
<p class="mt-2 text-base text-slate-600 dark:text-slate-400">Upload your resume to get a personalized roadmap. We support PDF and DOCX files.</p>
</div>
<form class="space-y-6">
<div>
<label class="sr-only" for="resume-upload">Upload resume</label>
<div class="relative mt-2 flex justify-center rounded-lg border-2 border-dashed border-slate-300 dark:border-slate-600 px-6 py-10 hover:border-primary transition-colors">
<div class="text-center">
<span class="material-symbols-outlined text-4xl text-slate-400 dark:text-slate-500">
                        upload_file
                      </span>
<div class="mt-4 flex text-sm leading-6 text-slate-600 dark:text-slate-400">
<label class="relative cursor-pointer rounded-md font-semibold text-primary focus-within:outline-none focus-within:ring-2 focus-within:ring-primary focus-within:ring-offset-2 dark:focus-within:ring-offset-background-dark hover:text-primary/90" for="file-upload">
<span>Upload a file</span>
<input class="sr-only" id="file-upload" name="file-upload" type="file"/>
</label>
<p class="pl-1">or drag and drop</p>
</div>
<p class="text-xs leading-5 text-slate-500 dark:text-slate-400">PDF, DOCX up to 10MB</p>
</div>
</div>
</div>
<div>
<label class="block text-sm font-medium leading-6 text-slate-900 dark:text-slate-200" for="skill">Desired Skill or Career</label>
<div class="mt-2">
<input class="block w-full rounded-lg border-0 py-3 px-4 bg-background-light dark:bg-background-dark text-slate-900 dark:text-white shadow-sm ring-1 ring-inset ring-slate-300 dark:ring-slate-700 placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:ring-2 focus:ring-inset focus:ring-primary sm:text-sm sm:leading-6 transition" id="skill" name="skill" placeholder="e.g., Frontend Developer, Data Scientist" required="" type="text"/>
</div>
</div>
<div>
<button class="flex w-full justify-center rounded-lg bg-primary px-4 py-3 text-sm font-bold text-white shadow-sm hover:bg-primary/90 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary transition-colors" type="submit">
                    Generate My Roadmap
                  </button>
</div>
</form>
</div>
</div>
</main>
</div>
</div>

</body></html>
